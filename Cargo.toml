[package]
name = "tuios_rust"
version = "0.1.0"
edition = "2021"
description = "tuiOS — Terminal UI Experience (Rust/ratatui port)"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
# preserve_order keeps JSON keys in file order instead of re-sorting them on every write
serde_json = { version = "1", features = ["preserve_order"] }
chrono = "0.4"
sysinfo = "0.32"
lazy_static = "1.4"
portable-pty = "0.8"
vt100 = "0.15"
ratatui-explorer = { version = "0.2.1", features = ["crossterm"] }
ureq = "2"
ratatui-splash-screen = { version = "0.1.5", default-features = false, features = ["png"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# NVIDIA stats (loads the driver library at runtime). Only PCs can have an NVIDIA card,
# so Raspberry Pi (ARM) and macOS builds leave it out entirely.
[target.'cfg(any(windows, all(target_os = "linux", target_arch = "x86_64")))'.dependencies]
nvml-wrapper = "0.13"
